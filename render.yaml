# Backend for the split deploy (README → Deploying): the whole app as one always-on Node process.
services:
  - type: web
    name: reception-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "false"
      # Committed Supabase CA; paste the PEM instead if you use another provider.
      - key: DATABASE_CA_CERT
        value: ./prod-ca-2021.crt
      # The Vercel URL, e.g. https://reception.vercel.app
      - key: APP_URL
        sync: false
      # This service's own URL, e.g. https://reception-api.onrender.com
      - key: VOICE_STREAM_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
